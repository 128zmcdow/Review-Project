<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Website</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <style>
        .card-img-top {
            height: 200px;
            object-fit: cover;
            object-position: top;
        }
    </style>
</head>

<body class="bg-primary text-white">

    <div class="container-fluid p-5">
        <h1 class="text-center mb-5">Find Your Perfect Companion</h1>
        <h2 class="mb-4">Dogs Section</h2>
        <div class="row mb-5">
            <div class="col-md-4 mb-3 mb-md-0">
                <div class="card h-100">
                    <img src="img/puppy.jpg" class="card-img-top" alt="dog">
                    <div class="card-body">
                        <h5 class="card-title">Dog</h5>
                        <p class="card-text">Dog</p>
                        <a href="#" class="btn btn-primary">Learn More</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3 mb-md-0">
                <div class="card h-100">
                    <img src="img/kitty02.jpg" class="card-img-top" alt="dog">
                    <div class="card-body">
                        <h5 class="card-title">Cat 1</h5>
                        <p class="card-text">Cat 1</p>
                        <a href="#" class="btn btn-primary">Learn More</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3 mb-md-0">
                <div class="card h-100">
                    <img src="img/kitty01.jpg" class="card-img-top" alt="dog">
                    <div class="card-body">
                        <h5 class="card-title">Cat 2</h5>
                        <p class="card-text">Cat 2</p>
                        <a href="#" class="btn btn-primary">Learn More</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
